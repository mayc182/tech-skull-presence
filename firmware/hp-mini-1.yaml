esphome:
  name: hp-mini-1
  friendly_name: HP-mini-1
  project:
    name: "MYumar.HP_series"
    version: "1.0.0"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key_mini

ota:
  - platform: esphome
    password: !secret ota_password_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB      
  power_save_mode: NONE

  ap:
    ssid: "Hp-Mini-1 Fallback Hotspot"
    password: !secret wifi_password_ap

web_server:
  port: 80
  include_internal: true

substitutions:
  tx_pin: GPIO21
  rx_pin: GPIO20

uart:
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 256000

ld2410:
  id: ld2410_device

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true

sensor:
  - platform: ld2410
    detection_distance:
      name: "Detection Distance"
      id: presence_det_dist
      unit_of_measurement: "cm"
      accuracy_decimals: 0
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
        - lambda: |-
            if (x < 15 || x > 600) return NAN;
            return x;

  - platform: template
    name: "Last Detection Distance"
    id: last_detection_distance
    unit_of_measurement: "cm"
    accuracy_decimals: 0
    update_interval: 500ms
    lambda: |-
      static float last_valid = NAN;
      if (id(binary_has_target).state && !isnan(id(presence_det_dist).state)) {
        last_valid = id(presence_det_dist).state;
      }
      return last_valid;

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence"
      id: binary_has_target
    has_moving_target:
      name: "Moving Presence"
    has_still_target:
      name: "Still Presence"

  - platform: template
    name: "Zone 1 Occupancy"
    device_class: occupancy
    filters:
      - delayed_on: 500ms
      - delayed_off: 2s
    lambda: |-
      return id(binary_has_target).state &&
             id(last_detection_distance).state < id(presence_z1_end).state;

  - platform: template
    name: "Zone 2 Occupancy"
    device_class: occupancy
    filters:
      - delayed_on: 500ms
      - delayed_off: 2s
    lambda: |-
      return id(binary_has_target).state &&
             id(last_detection_distance).state >= id(presence_z1_end).state &&
             id(last_detection_distance).state < id(presence_z2_end).state;

  - platform: template
    name: "Zone 3 Occupancy"
    device_class: occupancy
    filters:
      - delayed_on: 500ms
      - delayed_off: 2s
    lambda: |-
      return id(binary_has_target).state &&
             id(last_detection_distance).state >= id(presence_z2_end).state &&
             id(last_detection_distance).state < id(presence_z3_end).state;

switch:
  - platform: ld2410
    engineering_mode:
      name: "Engineering Mode"
    bluetooth:
      name: "Control Bluetooth"

button:
  - platform: ld2410
    factory_reset:
      name: "LD2410 Factory Reset"
      entity_category: diagnostic
    restart:
      name: "LD2410 Restart"
      entity_category: diagnostic
    query_params:
      name: "Query Params"
      entity_category: diagnostic

number:
  # ZONAS (optimistic — solo HA, no tocan el sensor)
  - platform: template
    name: "Zone 1 End Distance"
    id: presence_z1_end
    unit_of_measurement: "cm"
    min_value: 20
    max_value: 600
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 50
    entity_category: config

  - platform: template
    name: "Zone 2 End Distance"
    id: presence_z2_end
    unit_of_measurement: "cm"
    min_value: 30
    max_value: 600
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 100
    entity_category: config

  - platform: template
    name: "Zone 3 End Distance"
    id: presence_z3_end
    unit_of_measurement: "cm"
    min_value: 50
    max_value: 600
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 200
    entity_category: config

  # PARÁMETROS LD2410 (platform: ld2410) — el componente maneja aplicar los cambios al hardware
  - platform: ld2410
    timeout:
      name: "Timeout"
    light_threshold:
      name: "Light Threshold"
    max_move_distance_gate:
      name: "Max Move Distance Gate"
    max_still_distance_gate:
      name: "Max Still Distance Gate"
    g0:
      move_threshold:
        name: "G0 Move Threshold"
      still_threshold:
        name: "G0 Still Threshold"
    g1:
      move_threshold:
        name: "G1 Move Threshold"
      still_threshold:
        name: "G1 Still Threshold"
    g2:
      move_threshold:
        name: "G2 Move Threshold"
      still_threshold:
        name: "G2 Still Threshold"
    g3:
      move_threshold:
        name: "G3 Move Threshold"
      still_threshold:
        name: "G3 Still Threshold"
    g4:
      move_threshold:
        name: "G4 Move Threshold"
      still_threshold:
        name: "G4 Still Threshold"
    g5:
      move_threshold:
        name: "G5 Move Threshold"
      still_threshold:
        name: "G5 Still Threshold"
    g6:
      move_threshold:
        name: "G6 Move Threshold"
      still_threshold:
        name: "G6 Still Threshold"
    g7:
      move_threshold:
        name: "G7 Move Threshold"
      still_threshold:
        name: "G7 Still Threshold"
    g8:
      move_threshold:
        name: "G8 Move Threshold"
      still_threshold:
        name: "G8 Still Threshold"
