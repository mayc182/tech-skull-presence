name: Tech Skull Presence
version: 0.2.7
slug: tech-skull-presence
description: Visual configurator and dashboard for MYumar.HP_series DIY mmWave presence sensors (LD2410 + LD2450, optional SCD40/BH1750/WS2812/RTTTL buzzer).
url: https://github.com/mayc182/tech-skull-presence/tree/main/tech-skull-presence
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
ingress: true
ingress_port: 42069
panel_icon: mdi:skull-scan-outline
panel_title: HP Presence
watchdog: "http://[HOST]:[PORT:42069]/api/health"
ports:
  42069/tcp: null
  38080/tcp: 38080
ports_description:
  42069/tcp: Optional direct access (ingress preferred, configurable in app settings)
  38080/tcp: LAN firmware server for device OTA updates (configurable in app settings)
homeassistant_api: true
auth_api: true
hassio_api: true
host_network: true
stdin: true
stdin_open: true
init: false
environment:
  PORT: "42069"
  FIRMWARE_LAN_PORT: "38080"
map:
  - config:rw
  - share:rw
options:
  port: 42069
  firmware_lan_port: 38080
schema:
  port: port
  firmware_lan_port: port
